<body data-page="apply">
<main id="main">
<section class="page-hero"><div class="wrap">
<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">›</span><a href="careers.html">Careers</a><span aria-hidden="true">›</span><span aria-current="page">Full-Time Opportunities</span></nav>
<span class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg> CAREERS / FULL-TIME</span>
<h1 class="h1 mt-s">Make a career<br><span class="chrome">out of creating.</span></h1>
<p class="lead">Explore roles and apply. Openings are approved by the hiring team before publication.</p>
</div></section>
<section class="section-tight"><div class="wrap" style="max-width:860px">
  <form class="card form" id="form-job" novalidate>
    <h2 class="h3">Apply for a role</h2>
    <div class="two">
      <label class="field"><span>Name *</span><input type="text" name="name" required maxlength="120" autocomplete="name"></label>
      <label class="field"><span>Email *</span><input type="email" name="email" required maxlength="160" autocomplete="email"></label>
    </div>
    <div class="two">
      <label class="field"><span>Role of interest *</span><select name="role" required><option value="">Choose a role</option><option>Graphic Designer</option><option>Content Writer</option><option>Video Editor</option><option>Marketing Operations</option><option>Internship / Trainee</option><option>Other</option></select></label>
      <label class="field"><span>City *</span><input type="text" name="city" required maxlength="80"></label>
    </div>
    <div class="two">
      <label class="field"><span>Resume / CV link *</span><input type="url" name="cv_link" required maxlength="500" placeholder="https://"></label>
      <label class="field"><span>Portfolio / work samples link</span><input type="url" name="portfolio" maxlength="500" placeholder="https://"></label>
    </div>
    <label class="field"><span>Anything else?</span><textarea name="notes" maxlength="3000"></textarea></label>
    <label class="check"><input type="checkbox" name="consent" value="yes" required><span>I agree that Shooting Stars Media may contact me about this request, as described in the <a href="privacy.html" target="_blank">privacy notice</a>.</span></label>
    <button class="btn btn-primary" type="submit" style="align-self:flex-start"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg> Send application ↗</button>
  </form>
</div></section>
</main>
